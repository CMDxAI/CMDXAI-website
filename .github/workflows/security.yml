name: Security & Dependencies

on:
  pull_request:
    branches: [main, docusaurus]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json

      - run: npm ci

      - name: Security audit (fails on high/critical)
        run: npm audit --audit-level=high

      # Informational: Docusaurus 3.10.2 pins build-time deps with open advisories (braces,
      # tinypool, serialize-javascript) that have no non-breaking fix. They run only in CI
      # on our own content; the site ships static HTML. Make this blocking once upstream fixes land.
      - name: Security audit, docs site (informational)
        run: npm audit --audit-level=high
        working-directory: docs-site
        continue-on-error: true

      - name: Outdated packages (informational)
        run: npm outdated
        continue-on-error: true
